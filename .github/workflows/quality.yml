name: Quality

on:
  pull_request:
  push:
    branches:
      - main

jobs:
  quality:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: monolyth
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.14

      - name: Install ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Prepare test database
        run: bun --filter @monolyth/backend db:push

      - name: Check
        run: bun run check

      - name: Build and test desktop application
        run: bun --filter @monolyth/desktop build && bun --filter @monolyth/desktop test

      - name: Generate server coverage
        run: bun run test:coverage

      - name: Upload server coverage
        uses: actions/upload-artifact@v4
        with:
          name: server-coverage
          path: coverage/server/lcov.info
          if-no-files-found: error
