<!doctype html>
<html lang="ru">
	<head>
		<meta charset="UTF-8" />
		<meta name="viewport" content="width=device-width, initial-scale=1.0" />
		<title>Monolyth / performance lab</title>
		<style>
			:root {
				color-scheme: dark;
				--ink: #f4f5ed;
				--muted: #89908a;
				--panel: #191d1b;
				--line: #303733;
				--acid: #c9f25a;
				--coral: #ff8066;
				--bg: #101311;
				font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
			}

			* {
				box-sizing: border-box;
			}
			body {
				margin: 0;
				min-width: 320px;
				background: var(--bg);
				color: var(--ink);
			}
			main {
				width: min(1180px, calc(100% - 40px));
				margin: 0 auto;
				padding: 58px 0 72px;
			}
			.eyebrow {
				color: var(--acid);
				font-size: 11px;
				letter-spacing: 0.16em;
				text-transform: uppercase;
			}
			h1 {
				max-width: 760px;
				margin: 16px 0 12px;
				font:
					600 clamp(34px, 6vw, 76px)/0.95 Georgia,
					serif;
				letter-spacing: -0.05em;
			}
			.lede {
				max-width: 640px;
				margin: 0;
				color: var(--muted);
				font:
					15px/1.7 system-ui,
					sans-serif;
			}
			.toolbar {
				display: flex;
				flex-wrap: wrap;
				gap: 12px;
				margin: 44px 0 18px;
			}
			.field {
				display: grid;
				gap: 7px;
				color: var(--muted);
				font-size: 10px;
				letter-spacing: 0.12em;
				text-transform: uppercase;
			}
			select {
				min-width: 190px;
				border: 1px solid var(--line);
				border-radius: 3px;
				background: var(--panel);
				color: var(--ink);
				padding: 10px 12px;
				font: inherit;
				font-size: 12px;
			}
			input[type="date"] {
				border: 1px solid var(--line);
				border-radius: 3px;
				background: var(--panel);
				color: var(--ink);
				padding: 9px 10px;
				font: inherit;
				font-size: 12px;
			}
			.panel {
				border: 1px solid var(--line);
				background: linear-gradient(145deg, #1a201c, #151816);
			}
			.chart-head {
				display: flex;
				justify-content: space-between;
				align-items: baseline;
				gap: 20px;
				padding: 18px 20px;
				border-bottom: 1px solid var(--line);
			}
			.chart-title {
				margin: 0;
				font-size: 13px;
				font-weight: 600;
			}
			.chart-unit {
				color: var(--muted);
				font-size: 11px;
			}
			.chart-wrap {
				overflow-x: auto;
				padding: 14px 20px 18px;
			}
			svg {
				display: block;
				width: 100%;
				min-width: 680px;
				height: 360px;
			}
			.grid {
				stroke: var(--line);
				stroke-width: 1;
			}
			.axis {
				fill: var(--muted);
				font-size: 10px;
			}
			.trace {
				fill: none;
				stroke: var(--acid);
				stroke-linecap: round;
				stroke-linejoin: round;
				stroke-width: 3;
			}
			.point {
				fill: var(--bg);
				stroke: var(--acid);
				stroke-width: 2;
				cursor: crosshair;
			}
			.point:hover {
				fill: var(--acid);
				r: 6;
			}
			.point.selected {
				fill: var(--coral);
				stroke: var(--coral);
				r: 6;
			}
			.cards {
				display: grid;
				grid-template-columns: repeat(4, 1fr);
				gap: 1px;
				margin-top: 18px;
				background: var(--line);
				border: 1px solid var(--line);
			}
			.card {
				min-height: 108px;
				padding: 17px;
				background: var(--panel);
			}
			.card-label {
				color: var(--muted);
				font-size: 10px;
				text-transform: uppercase;
				letter-spacing: 0.08em;
			}
			.card-value {
				margin-top: 18px;
				font-size: 21px;
				color: var(--acid);
			}
			.detail {
				display: grid;
				grid-template-columns: 1fr 1fr;
				gap: 18px;
				margin-top: 18px;
			}
			.detail > section {
				padding: 20px;
			}
			h2 {
				margin: 0 0 18px;
				font-size: 12px;
				text-transform: uppercase;
				letter-spacing: 0.1em;
			}
			table {
				width: 100%;
				border-collapse: collapse;
				font-size: 12px;
			}
			th,
			td {
				padding: 10px 0;
				border-bottom: 1px solid var(--line);
				text-align: left;
			}
			th {
				color: var(--muted);
				font-weight: 400;
			}
			td:last-child,
			th:last-child {
				text-align: right;
			}
			.status {
				margin-top: 18px;
				color: var(--muted);
				font:
					12px/1.6 system-ui,
					sans-serif;
			}
			.status strong {
				color: var(--acid);
			}
			@media (max-width: 760px) {
				main {
					width: min(100% - 24px, 1180px);
					padding-top: 34px;
				}
				.cards {
					grid-template-columns: repeat(2, 1fr);
				}
				.detail {
					grid-template-columns: 1fr;
				}
			}
		</style>
	</head>
	<body>
		<main>
			<div class="eyebrow">Monolyth / local performance lab</div>
			<h1>Скорость — тоже часть продукта.</h1>
			<p class="lede">
				История серверных smoke-тестов. Выберите шаг и метрику, чтобы увидеть, как меняется поведение API
				после коммитов.
			</p>

			<div class="toolbar">
				<div class="field">
					<span>Шаг</span>
					<select id="step">
						<option value="">Загрузка…</option>
					</select>
				</div>
				<div class="field">
					<span>Метрика</span>
					<select id="metric">
						<option value="medianMs">Медиана, ms</option>
						<option value="avgMs">Среднее, ms</option>
						<option value="p95Ms">P95, ms</option>
						<option value="p99Ms">P99, ms</option>
						<option value="minMs">Минимум, ms</option>
						<option value="maxMs">Максимум, ms</option>
						<option value="stdDevMs">StdDev, ms</option>
						<option value="avgReqPerSec">Среднее, req/sec</option>
						<option value="medianReqPerSec">Медиана, req/sec</option>
					</select>
				</div>
				<div class="field">
					<span>Период</span>
					<select id="period">
						<option value="day">День</option>
						<option value="week">Неделя</option>
						<option value="month">Месяц</option>
						<option value="custom">Выбрать период</option>
					</select>
				</div>
				<div class="field" id="custom-range" hidden>
					<span>От — до</span>
					<div>
						<input id="from" type="date" />
						<input id="to" type="date" />
					</div>
				</div>
			</div>

			<section class="panel">
				<div class="chart-head">
					<h2 class="chart-title" id="chart-title">Загрузка…</h2>
					<span class="chart-unit" id="chart-unit"></span>
				</div>
				<div class="chart-wrap">
					<svg id="chart" viewBox="0 0 1000 360" role="img" aria-label="График производительности"></svg>
				</div>
			</section>
			<div class="cards" id="cards"></div>
			<div class="detail">
				<section class="panel">
					<h2>Выбранная точка</h2>
					<table id="details"></table>
				</section>
				<section class="panel">
					<h2>Окружение</h2>
					<table id="system"></table>
				</section>
			</div>
			<p class="status" id="status">Загрузка истории…</p>
		</main>
		<script>
			const state = {
				history: {},
				dates: [],
				step: "",
				metric: "medianMs",
				period: "day",
				from: "",
				to: "",
				selectedEntry: null,
			};
			const metricLabels = {
				medianMs: ["Медиана", "ms"],
				avgMs: ["Среднее", "ms"],
				p95Ms: ["P95", "ms"],
				p99Ms: ["P99", "ms"],
				minMs: ["Минимум", "ms"],
				maxMs: ["Максимум", "ms"],
				stdDevMs: ["StdDev", "ms"],
				avgReqPerSec: ["Среднее", "req/sec"],
				medianReqPerSec: ["Медиана", "req/sec"],
			};
			const $ = (id) => document.getElementById(id);
			const format = (value) => (typeof value === "number" ? value.toFixed(2) : "—");
			const escapeHtml = (value) =>
				String(value ?? "")
					.replaceAll("&", "&amp;")
					.replaceAll("<", "&lt;")
					.replaceAll(">", "&gt;")
					.replaceAll('"', "&quot;");
			const runsForDate = (date) =>
				(Array.isArray(state.history[date]) ? state.history[date] : [state.history[date]]).filter(Boolean);
			const latestRun = (date) => runsForDate(date).at(-1) || {};
			const dateValue = (date) => new Date(`${date}T00:00:00Z`).getTime();
			const visibleDates = () => {
				if (!state.dates.length) return [];
				if (state.period === "custom") {
					return state.dates.filter(
						(date) => (!state.from || date >= state.from) && (!state.to || date <= state.to)
					);
				}
				const latest = dateValue(state.dates.at(-1));
				const days = state.period === "month" ? 30 : state.period === "week" ? 7 : 1;
				const first = latest - (days - 1) * 24 * 60 * 60 * 1000;
				return state.dates.filter((date) => dateValue(date) >= first && dateValue(date) <= latest);
			};
			const entriesForDates = (dates) =>
				dates.flatMap((date) => runsForDate(date).map((run) => ({ date, run })));

			function renderDetails(entry) {
				const run = entry?.run || {};
				const step = run.steps?.[state.step] || {};
				$("details").innerHTML = [
					["runAt", "Время запуска", run.runAt],
					["commit", "Коммит", run.commit?.message || run.commit?.sha],
					["avgMs", "Среднее, ms", format(step.avgMs)],
					["medianMs", "Медиана, ms", format(step.medianMs)],
					["p95Ms", "P95, ms", format(step.p95Ms)],
					["p99Ms", "P99, ms", format(step.p99Ms)],
					["minMs", "Минимум, ms", format(step.minMs)],
					["maxMs", "Максимум, ms", format(step.maxMs)],
					["stdDevMs", "StdDev, ms", format(step.stdDevMs)],
					["avgReqPerSec", "Среднее, req/sec", format(step.avgReqPerSec)],
					["medianReqPerSec", "Медиана, req/sec", format(step.medianReqPerSec)],
					["successCount", "Успешно", format(step.successCount)],
					["errorCount", "Ошибки", format(step.errorCount)],
				]
					.map(([key, label, value]) => `<tr><th>${label}</th><td>${escapeHtml(value)}</td></tr>`)
					.join("");
				const system = run.system || {};
				$("system").innerHTML = [
					["cpuPercent", "CPU процесса, %"],
					["rssMb", "RSS, MB"],
					["heapUsedMb", "Heap, MB"],
					["warmupRuns", "Разминка", run.warmupRuns ?? 0],
					["runs", "Измерительных сценариев", run.runs],
				]
					.map(
						([key, label, fallback]) =>
							`<tr><th>${label}</th><td>${format(system[key] ?? fallback)}</td></tr>`
					)
					.join("");
			}

			function draw() {
				const metric = metricLabels[state.metric];
				const chartEntries = entriesForDates(visibleDates());
				const values = chartEntries
					.map((entry) => entry.run?.steps?.[state.step]?.[state.metric])
					.filter((value) => typeof value === "number");
				$("chart-title").textContent = `${state.step} · ${metric[0]}`;
				$("chart-unit").textContent = metric[1];
				const svg = $("chart");
				const width = 1000,
					height = 360,
					left = 62,
					right = 24,
					top = 24,
					bottom = 42;
				const max = Math.max(...values, 1),
					min = Math.min(...values, 0),
					range = max - min || 1;
				const x = (index) =>
					left +
					(chartEntries.length === 1
						? (width - left - right) / 2
						: (index * (width - left - right)) / (chartEntries.length - 1));
				const y = (value) => top + ((max - value) * (height - top - bottom)) / range;
				let markup = "";
				for (let index = 0; index < 5; index += 1) {
					const value = min + (range * index) / 4;
					const yy = y(value);
					markup += `<line class="grid" x1="${left}" y1="${yy}" x2="${width - right}" y2="${yy}"/><text class="axis" x="${left - 10}" y="${yy + 4}" text-anchor="end">${format(value)}</text>`;
				}
				const points = chartEntries.map((entry, index) => [
					x(index),
					y(entry.run?.steps?.[state.step]?.[state.metric] ?? min),
					entry,
				]);
				if (points.length > 1)
					markup += `<polyline class="trace" points="${points.map(([px, py]) => `${px},${py}`).join(" ")}"/>`;
				for (const [index, [px, py, entry]] of points.entries()) {
					const label = entry.run.runAt ? entry.run.runAt.replace("T", " ").slice(5, 16) : entry.date;
					const selected = state.selectedEntry?.run === entry.run ? " selected" : "";
					markup += `<circle class="point${selected}" data-point="${index}" cx="${px}" cy="${py}" r="4"><title>${label}: ${format(entry.run?.steps?.[state.step]?.[state.metric])} ${metric[1]}</title></circle>`;
				}
				for (const [index, entry] of chartEntries.entries()) {
					const label = entry.run.runAt ? entry.run.runAt.slice(11, 16) : entry.date.slice(5);
					markup += `<text class="axis" x="${x(index)}" y="${height - 12}" text-anchor="middle">${label}</text>`;
				}
				svg.innerHTML = markup;
				for (const point of svg.querySelectorAll("[data-point]")) {
					point.addEventListener("click", () => {
						state.selectedEntry = chartEntries[Number(point.getAttribute("data-point"))] || null;
						draw();
					});
				}

				const latestEntry = chartEntries.at(-1) || {
					date: state.dates.at(-1),
					run: latestRun(state.dates.at(-1)),
				};
				const latest = latestEntry.run?.steps?.[state.step] || {};
				$("cards").innerHTML = [
					["avgMs", "Среднее"],
					["medianMs", "Медиана"],
					["p95Ms", "P95"],
					["stdDevMs", "StdDev"],
				]
					.map(
						([key, label]) =>
							`<div class="card"><div class="card-label">${label}</div><div class="card-value">${format(latest[key])} <small>ms</small></div></div>`
					)
					.join("");
				if (!state.selectedEntry || !chartEntries.some((entry) => entry.run === state.selectedEntry.run))
					state.selectedEntry = latestEntry;
				renderDetails(state.selectedEntry);
				$("status").innerHTML =
					`Период: <strong>${visibleDates()[0] || "—"} — ${visibleDates().at(-1) || "—"}</strong> · точек: <strong>${chartEntries.length}</strong> · выбран: <strong>${state.selectedEntry?.run?.runAt || "—"}</strong>`;
			}

			async function loadHistory() {
				const urls =
					location.port === "5173"
						? ["http://localhost:3000/api/performance", "/api/performance"]
						: ["/api/performance"];
				for (const url of urls) {
					try {
						const response = await fetch(url);
						if (!response.ok || !response.headers.get("content-type")?.includes("application/json")) continue;
						return await response.json();
					} catch {}
				}
				throw new Error("API истории недоступно");
			}

			async function init() {
				state.history = await loadHistory();
				state.dates = Object.keys(state.history).sort();
				const steps = Object.keys(latestRun(state.dates.at(-1)).steps || {});
				state.step = steps[0] || "—";
				$("step").innerHTML = steps.map((step) => `<option value="${step}">${step}</option>`).join("");
				$("step").onchange = (event) => {
					state.step = event.target.value;
					draw();
				};
				$("metric").onchange = (event) => {
					state.metric = event.target.value;
					draw();
				};
				$("period").onchange = (event) => {
					state.period = event.target.value;
					$("custom-range").hidden = state.period !== "custom";
					draw();
				};
				for (const id of ["from", "to"]) {
					$(id).onchange = (event) => {
						state[id] = event.target.value;
						state.period = "custom";
						$("period").value = "custom";
						$("custom-range").hidden = false;
						draw();
					};
				}
				draw();
			}
			init().catch((error) => {
				$("status").textContent = `Не удалось загрузить историю: ${error.message}`;
			});
		</script>
	</body>
</html>
